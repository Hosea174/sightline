[package]
name = "sightline"
version = "0.1.0"
edition = "2021"
default-run = "sightline"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
