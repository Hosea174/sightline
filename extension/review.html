<!doctype html><html><head><meta charset="utf-8"><title>Review recording · Sightline</title><link rel="stylesheet" href="review.css"><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="brand.css"></head><body><header><div class="brand"><img class="mark" src="icons/icon-48.png" alt="Sightline"><strong>Review recording</strong><span id="source"></span></div><div class="header-actions"><button class="quiet" id="discard">Delete recording</button><button class="primary" id="save">Save clip</button></div></header><main><section class="preview"><video id="video" playsinline></video><div class="transport"><button id="play" class="icon" aria-label="Play or pause" title="Play / pause (Space)">▶</button><span id="clock">00:00.00 / 00:00.00</span><span id="status" role="status"></span></div></section><aside><h2>Details</h2><label>Source name<input id="title" type="text"></label><label>Source link<input id="url" type="url" placeholder="https://"></label><label for="tags">Tags</label><div class="tags-field"><div id="tag-pills"></div><input id="tags" type="text" aria-controls="tag-suggestions" aria-autocomplete="list" autocomplete="off" placeholder="Add a tag?"></div><div id="tag-suggestions" class="tag-suggestions" hidden role="listbox" aria-label="Suggested tags"></div><div class="category-field"><span>Category</span><details class="category-menu"><summary id="category-label">Web design</summary><div class="category-options" role="group" aria-label="Category"><button type="button" data-value="Web design">Web design</button><button type="button" data-value="Illustration">Illustration</button><button type="button" data-value="Motion graphics">Motion graphics</button><button type="button" data-value="Other">Other</button></div></details><input id="category" type="hidden" value="Web design"></div><p>The full recording stays in Saved recordings until you delete it. Saved clips are kept separately.</p></aside></main><section class="timeline-panel"><div class="timeline-header"><div><strong>Timeline</strong><span id="duration"></span></div><div class="timeline-actions"><button id="split" title="Split at playhead (Ctrl+Alt+B)">Split</button><button id="delete" title="Delete selected clip (Delete)">Delete</button><button id="reset" title="Restore original">Reset</button></div></div><div class="timeline-scroll"><div class="ruler" id="ruler" aria-label="Timeline ruler"></div><div id="track" class="track" aria-label="Video timeline"><div id="clips"></div><div id="playhead" class="playhead" role="slider" tabindex="0" aria-label="Playhead" aria-valuemin="0" aria-valuenow="0"></div></div></div><div class="help"><span>Space <em>Play</em></span><span>Q / W <em>Trim to playhead</em></span><span>Ctrl Alt B <em>Split</em></span><span>← / → <em>Frame</em></span><span>Del <em>Remove clip</em></span></div></section><div id="toast" role="status" aria-live="polite"></div><script src="recordings-db.js"></script><script src="tags.js"></script><script src="brand.js"></script><script src="review.js"></script></body></html>
