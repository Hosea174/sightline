<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{width:310px;margin:0;background:#1d1e21;color:#eee;font:13px 'Segoe UI',sans-serif}header{display:flex;align-items:center;gap:9px;padding:16px;border-bottom:1px solid #35363a}header strong{font-size:14px}.mark{display:grid;place-items:center;width:25px;height:25px;background:#2861b6;border-radius:6px;font-weight:700}.sub{margin-left:auto;color:#a7a8ad;font-size:11px}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:15px}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #9cbff5;outline-offset:2px}.tool{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 2px;border:1px solid #37383d;border-radius:7px;background:#292a2e;color:#e8e8ea;font-size:11px}.tool:hover{background:#36373c}.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tool.recording{color:#ff9999;border-color:#a95659;background:#39292b}.section{padding:0 15px 14px}#status{display:block;min-height:18px;color:#b4b5ba;line-height:1.45;font-size:11px}.links{display:flex;justify-content:space-between;border-top:1px solid #35363a;padding:11px 15px}.link{border:0;background:transparent;color:#c7c8cc;padding:2px;font-size:11px}.link:hover{color:white}#fontList{max-height:220px;overflow:auto}.item{border-top:1px solid #37383d;padding:9px 0;display:flex;align-items:center;gap:8px}.item strong{flex:1}.item button{background:#303136;color:#eee;border:1px solid #48494e;border-radius:5px;padding:5px 7px;font-size:11px}.hint{color:#a4a5aa;font-size:11px}
</style><link rel="stylesheet" href="brand.css"></head><body><header><img class="mark" src="icons/icon-48.png" alt="Sightline"><strong>Sightline</strong><span class="sub">Capture</span></header><div class="tools"><button class="tool" id="screenshot" title="Capture visible tab" aria-label="Capture visible tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg><span>Screen</span></button><button class="tool" id="full-page" title="Capture full page" aria-label="Capture full page"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Full page</span></button><button class="tool" id="area" title="Capture area" aria-label="Capture area"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M8 8h8v8H8z"/></svg><span>Area</span></button><button class="tool" id="record" title="Start recording" aria-label="Start recording"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span>Record</span></button><button class="tool" id="fonts" title="Find fonts" aria-label="Find fonts"><svg viewBox="0 0 24 24"><path d="M4 19 10 5h2l6 14M6 15h10M18 10h3M19.5 10v9"/></svg><span>Fonts</span></button></div><div class="section"><span id="status" role="status">Capture a detail to add it to your library.</span><div id="fontList"></div></div><div class="links"><button class="link" id="recordings">Saved recordings</button><button class="link" id="shortcuts">Keyboard shortcuts</button></div><script src="recordings-db.js"></script><script src="popup.js"></script></body></html>
